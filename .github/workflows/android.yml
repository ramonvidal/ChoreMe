name: Android build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # Lets anyone with access rebuild from the Actions tab, e.g. after adding the Firebase secrets.
  workflow_dispatch:

jobs:
  build:
    # After the rules are tested (and published), so a release never needs rules that aren't live.
    needs: firestore-rules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Publishing the APK to the "latest" release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Both are optional: without them the APK builds, but has no sync and no Google sign-in.
      - name: Add Firebase config and shared debug key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; echo "Firebase config added"; fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore; echo "Debug key added"; fi

      # A google-services.json without this app's package would build an app that can't sync or
      # sign in. Better to stop here, saying what to do, than to publish that.
      - name: Check the Firebase config is for this app
        run: |
          if [ ! -f app/google-services.json ]; then echo "No Firebase config: the app will build without sync."; exit 0; fi
          APP_ID=$(sed -n 's/.*applicationId = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if ! jq -e --arg id "$APP_ID" '[.client[].client_info.android_client_info.package_name] | index($id)' app/google-services.json > /dev/null; then
            echo "::error::GOOGLE_SERVICES_JSON has no app for $APP_ID. In Firebase (Project settings, Your apps) add an Android app with that package name, download google-services.json again, and replace the GOOGLE_SERVICES_JSON secret."
            exit 1
          fi
          echo "Firebase config has $APP_ID"

      # The shared debug key signs the APK on the release page; Google sign-in only works for a key
      # whose SHA-1 is registered for the app in Firebase. Shown on the run's summary page.
      - name: Show the debug key fingerprints
        run: |
          if [ ! -f app/debug.keystore ]; then exit 0; fi
          {
            echo "### Debug key fingerprints (add the SHA-1 to the app in Firebase)"
            keytool -list -v -keystore app/debug.keystore -storepass android | grep -E "SHA1|SHA256" | sed 's/^ *//'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Module structure rules tests
        run: ./gradlew -p build-logic :rules:test

      # Every Gradle invocation also checks the module structure (choreme.module-rules).
      - name: Unit tests
        run: ./gradlew :core:model:test testDebugUnitTest

      # Pictures of the screens that the UI tests draw (Roborazzi), for checking the layout.
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          find . -path '*/build/outputs/roborazzi/*.png' -exec cp {} screenshots/ \;
          ls screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      # The APK for the release page (github flavor: it updates itself).
      - name: Build APKs
        run: ./gradlew assembleGithubDebug assembleGithubRelease

      - uses: actions/upload-artifact@v4
        with:
          name: choreme-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk

      # The bundle for Google Play (play flavor: no self-updater), signed with the upload key.
      # Needs the UPLOAD_* secrets (see README, "Google Play"); without them this is skipped.
      - name: Build the Google Play bundle
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::notice::No UPLOAD_KEYSTORE_BASE64 secret, so no Google Play bundle was built. See README."
            exit 0
          fi
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew bundlePlayRelease -PplayUpload
          # The fingerprints of the upload key, for Firebase (they are public, like a certificate).
          {
            echo "### Upload key fingerprints (add the SHA-1 to the app in Firebase)"
            keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" | grep -E "SHA1|SHA256" | sed 's/^ *//'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/upload.jks"
          # Native libraries must support 16 KB memory pages (Google Play checks); the app has none of its own.
          unzip -l app/build/outputs/bundle/playRelease/*.aab | grep '\.so$' || echo "No native libraries in the bundle"

      - uses: actions/upload-artifact@v4
        if: hashFiles('app/build/outputs/bundle/playRelease/*.aab') != ''
        with:
          name: nos-corre-play-bundle
          path: app/build/outputs/bundle/playRelease/*.aab

      # One release per build, tagged v0.<build>, so update apps such as Obtainium see a new
      # version each time. GitHub's fixed link always serves the newest one:
      # https://github.com/<owner>/<repo>/releases/latest/download/ChoreMe.apk
      - name: Publish a release
        if: github.event_name != 'pull_request' && github.ref_name == 'claude/family-org-android-app-sdu50s'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk ChoreMe.apk
          (cd screenshots && zip -q ../screenshots.zip *.png)
          gh release create "v0.${GITHUB_RUN_NUMBER}" ChoreMe.apk screenshots.zip \
            --target "$GITHUB_SHA" \
            --title "ChoreMe 0.${GITHUB_RUN_NUMBER}" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. Install ChoreMe.apk on Android; it updates over any earlier ChoreMe build." \
            --latest
          # Keep the three newest releases, and drop the old fixed-name one from before.
          gh release delete latest --cleanup-tag --yes || true
          gh release list --limit 100 --json tagName --jq '.[3:][].tagName' | xargs -r -n1 gh release delete --cleanup-tag --yes

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Firestore security rules tests
        run: npm test

      # Publishes the tested rules to the family's Firebase project, so a new app version never
      # writes something the live rules don't allow yet. Needs the FIREBASE_SERVICE_ACCOUNT
      # secret (a service account key, JSON); without it this step only says so.
      - name: Publish the rules to Firebase
        if: github.event_name == 'push' && (github.ref_name == 'claude/family-org-android-app-sdu50s' || github.ref_name == 'main')
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::No FIREBASE_SERVICE_ACCOUNT secret, so the rules were not published. See README."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"
          node deploy-rules.mjs
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
